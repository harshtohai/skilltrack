<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#primaryGrad)" />
  <rect x="6" y="6" width="88" height="88" rx="22" stroke="#FDE68A" stroke-width="2" stroke-opacity="0.6" fill="none" />
  
  <!-- Central Stylized Ashoka Wheel & Torch Motif -->
  <!-- Gear Ring for Skilling / Industry -->
  <circle cx="50" cy="52" r="26" stroke="#FFFFFF" stroke-width="3.5" stroke-dasharray="7 3.5" fill="none" />
  <circle cx="50" cy="52" r="16" stroke="#FDE68A" stroke-width="2" fill="#1E293B" />
  
  <!-- 12 Radiating Spokes -->
  <g stroke="#FFFFFF" stroke-width="1.8" opacity="0.9">
    <line x1="50" y1="36" x2="50" y2="68" />
    <line x1="34" y1="52" x2="66" y2="52" />
    <line x1="39" y1="41" x2="61" y2="63" />
    <line x1="39" y1="63" x2="61" y2="41" />
  </g>
  
  <!-- Center Core -->
  <circle cx="50" cy="52" r="6" fill="url(#goldGrad)" />
  <circle cx="50" cy="52" r="2.5" fill="#FFFFFF" />

  <!-- Stylized Flame/Torch atop signifying knowledge & Maharashtra spirit -->
  <path d="M50 14 C46 22 43 26 47 31 C49 27 52 26 52 23 C54 26 56 28 54 32 C59 27 55 20 50 14 Z" fill="#F59E0B" />
  <path d="M50 18 C48 23 46 26 48 29 C49 26 51 25 51 23 C52 25 53 26 52 29 C55 26 53 22 50 18 Z" fill="#FEF3C7" />
  
  <!-- Laurel / Grain Base signifying Prosperity -->
  <path d="M30 78 C38 84 62 84 70 78" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" fill="none" />
</svg>
